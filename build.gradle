plugins { id 'com.gradle.plugin-publish' version '2.2.1' }
gradlePlugin {
    website = 'https://github.com/pozafly/spotless-bridge'
    vcsUrl = 'https://github.com/pozafly/spotless-bridge.git'
    plugins {
        spotlessBridge {
            id = 'io.github.pozafly.spotlessbridge'
            implementationClass = 'io.github.pozafly.spotlessbridge.SpotlessBridgePlugin'
            displayName = 'Spotless Bridge'
            tags.addAll('spotless', 'formatter', 'formatting', 'java', 'intellij', 'ai', 'daemon')
            description = "Format Java files with your project's own Spotless rules from AI coding hooks and IntelliJ, without waiting for Gradle on every run"
            compatibility(it) {
                features {
                    configurationCache = false
                    isolatedProjects = false
                }
            }
        }
    }
}
publishing { repositories { maven { name = 'test'; url = providers.gradleProperty('spotlessBridgeRepository').orElse(layout.buildDirectory.dir('repository').map { it.asFile.absolutePath }) } } }

publishing.publications.withType(MavenPublication).configureEach {
    pom.licenses {
        license {
            name = 'MIT License'
            url = 'https://opensource.org/license/mit'
            distribution = 'repo'
        }
    }
}
tasks.withType(Jar).configureEach {
    from('LICENSE') { into 'META-INF' }
}

repositories { mavenCentral() }
// Build with JDK 21 while keeping the engine, Gradle plugin and tests runnable on JDK 17.
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
tasks.named('compileJava', JavaCompile) { options.release = 17 }
tasks.named('compileTestJava', JavaCompile) { options.release = 17 }
// IDE-only tasks use a pinned SDK; engine/Gradle checks do not require an IDE installation.
// The first entry is the minimum supported SDK; every entry verifies the same ZIP.
def ideaTargets = new groovy.json.JsonSlurper().parse(file('gradle/idea-compatibility.json'))
def ideaSdkVersion = ideaTargets.first().version
def ideaSdkBuild = ideaTargets.first().build
def ideaSdkRoot = providers.gradleProperty('ideaSdkRoot').orElse(layout.projectDirectory.dir('.gradle/idea-sdks').asFile.absolutePath)
def ideaHome = providers.gradleProperty('ideaHome').orElse(ideaSdkRoot.map { "${it}/${ideaSdkVersion}" })
def ideaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
def ideaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
def ideaLibraries = files(fileTree("${ideaHome.get()}/lib") { include '*.jar' })
sourceSets {
    idea {
        compileClasspath += sourceSets.main.output + ideaLibraries
    }
    ideaTest {
        compileClasspath += sourceSets.idea.output + sourceSets.main.output + ideaLibraries
        runtimeClasspath += sourceSets.idea.output + sourceSets.main.output + ideaLibraries
    }
}
configurations { pluginVerifier }
dependencies {
    pluginVerifier "org.jetbrains.intellij.plugins:verifier-cli:${providers.gradleProperty('pluginVerifierVersion').get()}:all@jar"
    ideaTestImplementation 'junit:junit:4.13.2'
    ideaTestImplementation 'org.mockito:mockito-core:5.20.0'
}
tasks.register('verifyIdeaSdk') {
    group = 'verification'
    description = 'Require the pinned IntelliJ IDEA SDK before compiling or verifying the adapter'
    doLast {
        def home = file(ideaHome.get())
        def infoFile = new File(home, 'product-info.json')
        if (!infoFile.isFile()) infoFile = new File(home, 'Resources/product-info.json')
        if (!infoFile.isFile()) throw new GradleException("Set -PideaHome to IntelliJ IDEA ${ideaSdkVersion} (${ideaSdkBuild}); product-info.json was not found in ${home}")
        def info = new groovy.json.JsonSlurper().parse(infoFile)
        if (info.version != ideaSdkVersion || info.buildNumber != ideaSdkBuild || info.productCode != 'IU')
            throw new GradleException("Expected IntelliJ IDEA IU ${ideaSdkVersion} (${ideaSdkBuild}); found ${info.productCode} ${info.version} (${info.buildNumber}) in ${home}")
        logger.lifecycle("IntelliJ SDK: IU ${info.version} (${info.buildNumber})")
    }
}
tasks.named('compileIdeaJava', JavaCompile) {
    dependsOn 'verifyIdeaSdk'
    javaCompiler = ideaCompiler
    options.release = 21
    options.compilerArgs += ['-proc:none']
}
def ideaPluginVersion = project.version.toString()
tasks.named('processIdeaResources') {
    inputs.property('version', ideaPluginVersion)
    inputs.property('ideaSdkBuild', ideaSdkBuild)
    filesMatching('META-INF/plugin.xml') { expand(version: ideaPluginVersion, ideaSdkBuild: ideaSdkBuild) }
}
tasks.register('engineDist', Sync) {
    dependsOn jar
    into layout.buildDirectory.dir('engine')
    from(tasks.jar) { into 'lib' }
    from('src/main/resources/export.gradle')
}
tasks.register('ideaJar', Jar) {
    dependsOn ideaClasses, classes
    archiveBaseName = 'spotless-bridge-idea'
    from sourceSets.idea.output
    from(sourceSets.main.output) { include 'io/github/pozafly/spotlessbridge/WorkerClient*.class', 'io/github/pozafly/spotlessbridge/GradleFormatter*.class', 'io/github/pozafly/spotlessbridge/SharedDaemon*.class' }
}
tasks.register('pluginZip', Zip) {
    dependsOn ideaJar
    archiveFileName = "spotless-bridge-${version}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    into('spotless-bridge') {
        from(tasks.ideaJar) { into 'lib' }
    }
}
tasks.register('selfTest', JavaExec) {
    dependsOn testClasses, engineDist, publishAllPublicationsToTestRepository
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.pozafly.spotlessbridge.FormatterSelfTest'
    // Compile with the build JDK; run consumers, workers and hook bootstrap with the selected JDK.
    def testJavaHome = providers.gradleProperty('testJavaHome').orElse(System.getProperty('java.home')).get()
    executable = new File(testJavaHome, "bin/${System.getProperty('os.name').startsWith('Windows') ? 'java.exe' : 'java'}").absolutePath
    environment 'JAVA_HOME', testJavaHome
    // CI overrides the consumer Spotless version to catch upstream internal API changes early.
    systemProperty 'spotlessBridge.testSpotlessVersion', providers.gradleProperty('testSpotlessVersion').orElse('8.10.2').get()
    args layout.buildDirectory.dir('engine').get().asFile.absolutePath,
            layout.buildDirectory.dir('repository').get().asFile.absolutePath,
            project.version.toString(),
            providers.gradleProperty('testGradleVersion').orElse('8.14.3').get()
    workingDir rootDir
}
tasks.named('check') { dependsOn 'selfTest' }

// IDE verification is explicit so the existing engine compatibility matrix remains SDK-independent.
tasks.named('compileIdeaTestJava', JavaCompile) {
    dependsOn 'verifyIdeaSdk'
    javaCompiler = ideaCompiler
    options.release = 21
    options.compilerArgs += ['-proc:none']
}
tasks.register('ideaTest', Test) {
    group = 'verification'
    description = 'Verify Safe Mode blocks formatting, including an already cached client'
    testClassesDirs = sourceSets.ideaTest.output.classesDirs
    classpath = sourceSets.ideaTest.runtimeClasspath
    javaLauncher = ideaLauncher
    useJUnit()
    doFirst {
        jvmArgs "-javaagent:${configurations.ideaTestRuntimeClasspath.find { it.name.startsWith('mockito-core-') }}"
    }
}
tasks.register('verifyIdeaPlugin', JavaExec) {
    group = 'verification'
    description = 'Verify one ZIP against the pinned IntelliJ compatibility matrix'
    def suppliedZip = providers.gradleProperty('ideaPluginZip')
    // CI downloads the build job's ZIP. Verification never rebuilds that supplied artifact.
    if (!suppliedZip.isPresent()) dependsOn 'ideaTest', 'pluginZip'
    def zipFile = suppliedZip.map { file(it) }.orElse(tasks.pluginZip.archiveFile.map { it.asFile })
    def selectedVersion = providers.gradleProperty('ideaVerifyVersion')
    def targets = selectedVersion.isPresent() ? ideaTargets.findAll { it.version == selectedVersion.get() } : ideaTargets
    if (targets.isEmpty()) throw new GradleException("Unknown ideaVerifyVersion: ${selectedVersion.get()}")
    classpath = configurations.pluginVerifier
    mainClass = 'com.jetbrains.pluginverifier.PluginVerifierMain'
    javaLauncher = ideaLauncher
    maxHeapSize = '2g'
    def reports = layout.buildDirectory.dir('reports/plugin-verifier')
    def archiveHash
    doFirst {
        def homes = targets.collect { target ->
            def home = target.version == ideaSdkVersion ? file(ideaHome.get()) : file("${ideaSdkRoot.get()}/${target.version}")
            def infoFile = new File(home, 'product-info.json')
            if (!infoFile.isFile()) infoFile = new File(home, 'Resources/product-info.json')
            if (!infoFile.isFile()) throw new GradleException("Missing IntelliJ ${target.version} SDK in ${home}; see docs/install-from-source.md")
            def info = new groovy.json.JsonSlurper().parse(infoFile)
            if (info.version != target.version || info.buildNumber != target.build || info.productCode != 'IU')
                throw new GradleException("Expected IU ${target.version} (${target.build}); found ${info.productCode} ${info.version} (${info.buildNumber})")
            home.absolutePath
        }
        if (!zipFile.get().isFile()) throw new GradleException("Plugin ZIP not found: ${zipFile.get()}")
        archiveHash = java.security.MessageDigest.getInstance('SHA-256').digest(zipFile.get().bytes).encodeHex().toString()
        delete reports
        reports.get().asFile.mkdirs()
        logger.lifecycle("Verifying identical ZIP SHA-256: ${archiveHash}")
        // Each IDE's bundled runtime supplies its own Java 21/25 API during analysis.
        setArgs(['check-plugin', zipFile.get().absolutePath] + homes +
                ['-verification-reports-dir', reports.get().asFile.absolutePath])
    }
    doLast {
        new File(reports.get().asFile, 'plugin-sha256.txt').text = "${archiveHash}  ${zipFile.get().name}\n"
        if (archiveHash != java.security.MessageDigest.getInstance('SHA-256').digest(zipFile.get().bytes).encodeHex().toString())
            throw new GradleException('Plugin ZIP changed during verification')
        // Verifier can exit zero with compatibility problems; require a successful verdict for every pinned build.
        def verdicts = fileTree(reports).matching { include '**/verification-verdict.txt' }.files
        if (verdicts.size() != targets.size()) throw new GradleException("Expected ${targets.size()} Plugin Verifier verdicts; found ${verdicts.size()}")
        def failures = fileTree(reports).matching {
            include '**/compatibility-problems.txt', '**/invalid-plugin.txt', '**/internal-api-usages.txt',
                    '**/non-extendable-api-usages.txt', '**/override-only-usages.txt'
        }.files.findAll { !it.text.trim().isEmpty() }
        if (!failures.isEmpty()) throw new GradleException("Plugin Verifier failed: ${failures*.absolutePath.join(', ')}")
        targets.each { target ->
            def matches = verdicts.findAll { it.toPath().startsWith(new File(reports.get().asFile, "IU-${target.build}").toPath()) }
            if (matches.size() != 1 || !matches.first().text.trim().startsWith('Compatible'))
                throw new GradleException("Plugin Verifier did not confirm IntelliJ ${target.version} compatibility; see ${reports.get().asFile}")
            logger.lifecycle("IntelliJ ${target.version} (${target.build}): ${matches.first().text.trim()}")
        }
    }
}
