plugins { id 'com.gradle.plugin-publish' version '2.2.1' }
gradlePlugin {
    website = 'https://github.com/pozafly/spotless-bridge'
    vcsUrl = 'https://github.com/pozafly/spotless-bridge.git'
    plugins {
        spotlessBridge {
            id = 'io.github.pozafly.spotlessbridge'
            implementationClass = 'io.github.pozafly.spotlessbridge.SpotlessBridgePlugin'
            displayName = 'Spotless Bridge'
            tags.addAll('spotless', 'formatter', 'java', 'daemon')
            description = 'Project-owned Spotless Java daemon shared by editors and automation'
            compatibility(it) {
                features {
                    configurationCache = false
                    isolatedProjects = false
                }
            }
        }
    }
}
publishing { repositories { maven { name = 'test'; url = providers.gradleProperty('spotlessBridgeRepository').orElse(layout.buildDirectory.dir('repository').map { it.asFile.absolutePath }) } } }

publishing.publications.withType(MavenPublication).configureEach {
    pom.licenses {
        license {
            name = 'MIT License'
            url = 'https://opensource.org/license/mit'
            distribution = 'repo'
        }
    }
}
tasks.withType(Jar).configureEach {
    from('LICENSE') { into 'META-INF' }
}

repositories { mavenCentral() }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
// The IDE SDK is only needed for pluginZip, not for engine/Gradle tests or CI.
def ideaHome = providers.gradleProperty('ideaHome').orElse('/Applications/IntelliJ IDEA.app/Contents')
sourceSets {
    idea {
        compileClasspath += sourceSets.main.output + files(fileTree("${ideaHome.get()}/lib") { include '*.jar' })
    }
}
tasks.named('compileIdeaJava', JavaCompile) {
    options.fork = true
    options.forkOptions.executable = "${ideaHome.get()}/jbr/Contents/Home/bin/javac"
    options.release = 21
    options.compilerArgs += ['-proc:none']
}
tasks.named('processIdeaResources') {
    inputs.property('version', project.version)
    filesMatching('META-INF/plugin.xml') { expand(version: project.version) }
}
tasks.register('engineDist', Sync) {
    dependsOn jar
    into layout.buildDirectory.dir('engine')
    from(tasks.jar) { into 'lib' }
    from('src/main/resources/export.gradle')
}
tasks.register('ideaJar', Jar) {
    dependsOn ideaClasses, classes
    archiveBaseName = 'spotless-bridge-idea'
    from sourceSets.idea.output
    from(sourceSets.main.output) { include 'io/github/pozafly/spotlessbridge/WorkerClient*.class', 'io/github/pozafly/spotlessbridge/GradleFormatter*.class', 'io/github/pozafly/spotlessbridge/SharedDaemon*.class' }
}
tasks.register('pluginZip', Zip) {
    dependsOn ideaJar
    archiveFileName = "spotless-bridge-${version}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    into('spotless-bridge') {
        from(tasks.ideaJar) { into 'lib' }
    }
}
tasks.register('selfTest', JavaExec) {
    dependsOn testClasses, engineDist, publishAllPublicationsToTestRepository
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.pozafly.spotlessbridge.FormatterSelfTest'
    args layout.buildDirectory.dir('engine').get().asFile.absolutePath,
            layout.buildDirectory.dir('repository').get().asFile.absolutePath,
            project.version.toString()
    workingDir rootDir
}
tasks.named('check') { dependsOn 'selfTest' }
