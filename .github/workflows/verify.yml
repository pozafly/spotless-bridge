name: Spotless Bridge verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gradle-and-worker:
    name: Consumer Gradle ${{ matrix.gradle }} / JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        gradle: ["8.14.3", "8.14.6", "9.0.0", "9.8.1"]
        java: ["21"]
        include:
          - gradle: "9.8.1"
            java: "25"
    steps:
      - uses: actions/checkout@v7
      - name: Set up consumer JDK
        id: consumer-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Set up build JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify DSL, formatter output and persistent worker
        env:
          TEST_JAVA_HOME: ${{ steps.consumer-java.outputs.path }}
        run: ./gradlew --no-daemon --console=plain check engineDist -PtestGradleVersion=${{ matrix.gradle }} -PtestJavaHome="$TEST_JAVA_HOME"
      - uses: actions/upload-artifact@v4
        with:
          name: spotless-bridge-engine-gradle-${{ matrix.gradle }}-jdk-${{ matrix.java }}
          path: build/engine/
          if-no-files-found: error
