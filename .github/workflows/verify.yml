name: Spotless Bridge verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gradle-and-worker:
    name: ${{ matrix.os || 'ubuntu-latest' }} / Consumer Gradle ${{ matrix.gradle }} / JDK ${{ matrix.java }}
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # include entries with another os add jobs instead of changing the Ubuntu combinations.
        os: [ubuntu-latest]
        gradle: ["8.14.3", "8.14.6", "9.0.0", "9.8.1"]
        java: ["17", "21"]
        include:
          - gradle: "9.8.1"
            java: "25"
          # macOS covers the POSIX launcher and daemon lifecycle on a second OS; Windows is not verified yet.
          - os: macos-latest
            gradle: "8.14.3"
            java: "17"
          - os: macos-latest
            gradle: "9.8.1"
            java: "21"
    steps:
      - uses: actions/checkout@v7
      - name: Set up consumer JDK
        id: consumer-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Set up build JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify DSL, formatter output and persistent worker
        env:
          TEST_JAVA_HOME: ${{ steps.consumer-java.outputs.path }}
        run: ./gradlew --no-daemon --console=plain check engineDist -PtestGradleVersion=${{ matrix.gradle }} -PtestJavaHome="$TEST_JAVA_HOME"
      - uses: actions/upload-artifact@v4
        with:
          name: spotless-bridge-engine-${{ matrix.os || 'ubuntu-latest' }}-gradle-${{ matrix.gradle }}-jdk-${{ matrix.java }}
          path: build/engine/
          if-no-files-found: error

  intellij-build:
    name: Build IntelliJ ZIP with minimum SDK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      versions: ${{ steps.targets.outputs.versions }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Read pinned SDK matrix
        id: targets
        run: |
          echo "versions=$(jq -c '[.[].version]' gradle/idea-compatibility.json)" >> "$GITHUB_OUTPUT"
          echo "IDEA_VERSION=$(jq -r '.[0].version' gradle/idea-compatibility.json)" >> "$GITHUB_ENV"
          echo "IDEA_SHA256=$(jq -r '.[0].sha256' gradle/idea-compatibility.json)" >> "$GITHUB_ENV"
      - name: Download minimum IntelliJ SDK
        run: |
          archive="$RUNNER_TEMP/idea.tar.gz"
          curl --fail --location --retry 3 "https://download.jetbrains.com/idea/idea-${IDEA_VERSION}.tar.gz" --output "$archive"
          printf '%s  %s\n' "$IDEA_SHA256" "$archive" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/idea-sdks/$IDEA_VERSION"
          tar -xzf "$archive" -C "$RUNNER_TEMP/idea-sdks/$IDEA_VERSION" --strip-components=1
          rm "$archive"
      - name: Test Safe Mode and build one ZIP
        run: |
          ./gradlew --no-daemon --console=plain ideaTest pluginZip -PideaSdkRoot="$RUNNER_TEMP/idea-sdks"
          cd build/distributions
          sha256sum spotless-bridge-*.zip > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: spotless-bridge-intellij-zip
          path: build/distributions/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spotless-bridge-intellij-tests
          path: build/reports/tests/ideaTest/

  intellij-verifier:
    name: IntelliJ ${{ matrix.idea }} / identical ZIP
    needs: intellij-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # Verifier resolves Marketplace dependencies; limit bursts that can trigger HTTP 429.
      max-parallel: 2
      matrix:
        idea: ${{ fromJSON(needs.intellij-build.outputs.versions) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@v4
        with:
          name: spotless-bridge-intellij-zip
          path: build/distributions/
      - name: Download pinned verification SDK
        env:
          IDEA_VERSION: ${{ matrix.idea }}
        run: |
          sha=$(jq -r --arg version "$IDEA_VERSION" '.[] | select(.version == $version) | .sha256' gradle/idea-compatibility.json)
          archive="$RUNNER_TEMP/idea.tar.gz"
          curl --fail --location --retry 3 "https://download.jetbrains.com/idea/idea-${IDEA_VERSION}.tar.gz" --output "$archive"
          printf '%s  %s\n' "$sha" "$archive" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/idea-sdks/$IDEA_VERSION"
          tar -xzf "$archive" -C "$RUNNER_TEMP/idea-sdks/$IDEA_VERSION" --strip-components=1
          rm "$archive"
      - name: Verify downloaded ZIP without rebuilding
        env:
          IDEA_VERSION: ${{ matrix.idea }}
        run: |
          (cd build/distributions && sha256sum --check SHA256SUMS)
          zip=$(find "$PWD/build/distributions" -maxdepth 1 -name 'spotless-bridge-*.zip')
          ./gradlew --no-daemon --console=plain verifyIdeaPlugin \
            -PideaPluginZip="$zip" -PideaVerifyVersion="$IDEA_VERSION" -PideaSdkRoot="$RUNNER_TEMP/idea-sdks"
          (cd build/distributions && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spotless-bridge-intellij-verification-${{ matrix.idea }}
          path: build/reports/plugin-verifier/
          if-no-files-found: warn
