name: Spotless Bridge verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gradle-and-worker:
    name: ${{ matrix.os || 'ubuntu-latest' }} / Consumer Gradle ${{ matrix.gradle }} / JDK ${{ matrix.java }}
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # include entries with another os add jobs instead of changing the Ubuntu combinations.
        os: [ubuntu-latest]
        gradle: ["8.14.3", "8.14.6", "9.0.0", "9.8.1"]
        java: ["17", "21"]
        include:
          - gradle: "9.8.1"
            java: "25"
          # macOS covers the POSIX launcher and daemon lifecycle on a second OS; Windows is not verified yet.
          - os: macos-latest
            gradle: "8.14.3"
            java: "17"
          - os: macos-latest
            gradle: "9.8.1"
            java: "21"
    steps:
      - uses: actions/checkout@v7
      - name: Set up consumer JDK
        id: consumer-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Set up build JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify DSL, formatter output and persistent worker
        env:
          TEST_JAVA_HOME: ${{ steps.consumer-java.outputs.path }}
        run: ./gradlew --no-daemon --console=plain check engineDist -PtestGradleVersion=${{ matrix.gradle }} -PtestJavaHome="$TEST_JAVA_HOME"
      - uses: actions/upload-artifact@v4
        with:
          name: spotless-bridge-engine-${{ matrix.os || 'ubuntu-latest' }}-gradle-${{ matrix.gradle }}-jdk-${{ matrix.java }}
          path: build/engine/
          if-no-files-found: error

  intellij-adapter:
    name: IntelliJ SDK, Safe Mode and Plugin Verifier
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Read pinned SDK version
        run: |
          echo "IDEA_VERSION=$(sed -n 's/^ideaSdkVersion=//p' gradle.properties)" >> "$GITHUB_ENV"
          echo "IDEA_SHA256=$(sed -n 's/^ideaSdkLinuxSha256=//p' gradle.properties)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        id: idea-sdk
        with:
          path: ${{ runner.temp }}/idea-sdk
          key: idea-sdk-linux-${{ env.IDEA_VERSION }}-${{ env.IDEA_SHA256 }}
      - name: Download pinned IntelliJ SDK
        if: steps.idea-sdk.outputs.cache-hit != 'true'
        run: |
          archive="$RUNNER_TEMP/idea.tar.gz"
          curl --fail --location --retry 3 "https://download.jetbrains.com/idea/idea-${IDEA_VERSION}.tar.gz" --output "$archive"
          printf '%s  %s\n' "$IDEA_SHA256" "$archive" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/idea-sdk"
          tar -xzf "$archive" -C "$RUNNER_TEMP/idea-sdk" --strip-components=1
      - name: Verify SDK, Safe Mode and packaged plugin
        run: ./gradlew --no-daemon --console=plain verifyIdeaPlugin -PideaHome="$RUNNER_TEMP/idea-sdk"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spotless-bridge-intellij-verification
          path: |
            build/distributions/spotless-bridge-*.zip
            build/reports/plugin-verifier/
            build/reports/tests/ideaTest/
          if-no-files-found: warn
